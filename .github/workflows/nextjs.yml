# Build the static export and deploy it to GitHub Pages
name: Deploy to Pages

on:
  push:
    branches: ["master"]
  # Monthly rebuild: keeps the "Expires" date of /.well-known/security.txt
  # ahead (RFC 9116 wants it under a year) and refreshes the TryHackMe stats
  # and the GitHub contribution graph.
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a running deployment is never cancelled
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Lint, type check, data/asset audits, build and link check
  # (.github/workflows/verify.yml). Nothing is deployed unless it passes.
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # base_path is "" in Ahmed-Emad-Nasr.github.io (the domain root) and
      # "/<repo>" in a project repo; base_url is the full live address.
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      # The small cover of every case image (X-thumb.webp next to X.webp):
      # made here on every deploy, so a missing one never makes a page load
      # the full-size image. Only the missing ones are made (scripts/generate-thumbs.mjs).
      - run: npm run thumbs
      # Warns (never fails) about any image over 300 KB — see scripts/check-image-size.mjs
      - run: npm run check:images
      # output: "export" in next.config.mjs makes next build write out/
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
