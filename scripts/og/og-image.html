<!-- The share card (public/og-image.jpg, 1200×630): the picture LinkedIn, WhatsApp, X, Slack… show when the site's link is shared.
     To regenerate it: npm run og:site  (renders this file with Playwright and saves public/og-image.jpg).
     Fonts load from scripts/og/fonts; the portrait is scripts/og/portrait-cutout.webp (the photo with its background removed). -->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Dela;src:url(fonts/dela-gothic-one.woff2)}
@font-face{font-family:Yuji;src:url(fonts/yuji-syuku.woff2)}
@font-face{font-family:Mono;src:url(fonts/jetbrains-mono-latin.woff2);font-weight:100 800}
@font-face{font-family:Outfit;src:url(fonts/outfit-latin.woff2);font-weight:100 900}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#080808;color:#fff;font-family:Outfit;position:relative;overflow:hidden}
/* dot grid, like the site */
.grid{position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0);background-size:40px 40px}
.top{position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,#BC002D 0%,#BC002D 55%,#38bdf8 100%)}

/* ─── right side: the sun, the orbit ring, the portrait ─── */
.sun{position:absolute;left:640px;top:70px;width:500px;height:500px;border-radius:50%;
  background:radial-gradient(circle at 50% 45%,#d4002f 0%,#BC002D 38%,#7a001d 62%,rgba(188,0,45,0) 72%)}
.halo{position:absolute;left:560px;top:-10px;width:660px;height:660px;border-radius:50%;
  background:radial-gradient(circle,rgba(188,0,45,.28) 0%,rgba(188,0,45,.10) 45%,transparent 70%)}
.orbit{position:absolute;left:600px;top:30px;width:580px;height:580px;transform:rotate(-18deg)}
.orbit text{font-family:Mono;font-weight:700;font-size:13.2px;letter-spacing:4.6px;fill:rgba(255,255,255,.34);text-transform:uppercase}
.ring{position:absolute;left:610px;top:40px;width:560px;height:560px;border-radius:50%;border:1px dashed rgba(255,255,255,.12)}
.photo{position:absolute;left:390px;top:-6px;width:1000px;height:auto;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 84%,transparent 99%);mask-image:linear-gradient(to bottom,#000 0%,#000 84%,transparent 99%);
  filter:drop-shadow(0 0 1px rgba(255,255,255,.35)) drop-shadow(-14px 0 34px rgba(188,0,45,.35)) contrast(1.04)}
/* blends the photo into the left half */
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#080808 0%,#080808 40%,rgba(8,8,8,.85) 50%,rgba(8,8,8,0) 62%)}
.seal{position:absolute;left:1086px;top:506px;width:84px;height:84px;background:#BC002D;transform:rotate(6deg);display:flex;align-items:center;justify-content:center;font-family:Yuji;font-size:34px;color:#fff;border:1px solid rgba(255,255,255,.25)}
.seal:before{content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.5)}

/* ─── left side: who ─── */
.wrap{position:absolute;left:72px;top:62px;width:600px}
.badge{display:inline-flex;align-items:center;gap:12px;padding:10px 16px;border:1px solid rgba(255,255,255,.14);background:rgba(8,8,8,.7);font-family:Mono;font-size:14px;font-weight:700;letter-spacing:.28em;color:#b5b5b5;text-transform:uppercase}
.dot{width:9px;height:9px;background:#BC002D;box-shadow:0 0 12px #BC002D}
h1{margin-top:26px;font-family:Dela;font-size:94px;line-height:.9;letter-spacing:-.035em;text-transform:uppercase}
h1 .s{display:block;color:transparent;-webkit-text-stroke:2.6px #ff2d55;margin-left:34px}
.role{margin-top:26px;display:flex;align-items:center;gap:14px;font-family:Mono;font-size:21px;font-weight:800;letter-spacing:.22em;color:#FFD700;text-transform:uppercase}
.role:before{content:"";width:34px;height:2px;background:#FFD700}
.areas{margin-top:12px;font-family:Mono;font-size:14.5px;font-weight:600;letter-spacing:.16em;color:rgba(255,255,255,.62);text-transform:uppercase}
.chips{margin-top:26px;display:flex;gap:10px}
.chips span{padding:8px 13px;border:1px solid rgba(56,189,248,.45);background:rgba(8,20,28,.85);font-family:Mono;font-size:15px;font-weight:700;color:#8fdcff}
.chips b{color:#fff;font-weight:800}
.foot{position:absolute;left:72px;bottom:40px;display:flex;align-items:center;gap:18px;font-family:Mono;font-size:15px;letter-spacing:.2em;color:rgba(255,255,255,.5);text-transform:uppercase}
.mark{font-family:Dela;font-size:30px;letter-spacing:-.02em;color:#fff}.mark i{color:#BC002D;font-style:normal}
.bar{width:1px;height:22px;background:rgba(255,255,255,.2)}
</style></head><body>
<div class="grid"></div>
<div class="halo"></div>
<div class="sun"></div>
<div class="ring"></div>
<svg class="orbit" viewBox="0 0 200 200" aria-hidden="true">
 <defs><path id="o" d="M 100,100 m -94,0 a 94,94 0 1,1 188,0 a 94,94 0 1,1 -188,0"/></defs>
 <text style="font-size:4.55px;letter-spacing:1.6px"><textPath href="#o">SOC • INCIDENT RESPONSE • DFIR • GRC • ISO 27001 • IAM • MALWARE ANALYSIS • SPLUNK • WAZUH • 侍 •</textPath></text>
</svg>
<img class="photo" src="portrait-cutout.webp" alt="">
<div class="fade"></div>
<div class="seal">村長</div>
<div class="top"></div>

<div class="wrap">
 <div class="badge"><span class="dot"></span>GRC · SOC · DFIR · IAM</div>
 <h1>Ahmed<span class="s">Emad Nasr</span></h1>
 <div class="role">Information Security Officer</div>
 <div class="areas">Incident response · Malware analysis · Compliance</div>
 <div class="chips"><span><b>82</b> case studies</span><span><b>160h</b> SOC diploma</span><span><b>300+</b> students</span></div>
</div>
<div class="foot"><span class="mark">AE<i>.</i></span><span class="bar"></span><span>Cybersecurity instructor · AMIT &amp; NTI</span></div>
</body></html>
