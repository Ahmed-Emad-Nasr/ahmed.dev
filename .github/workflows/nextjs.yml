# Build the static export and deploy it to GitHub Pages
name: Deploy to Pages

on:
  push:
    branches: ["master"]
  # Daily rebuild (05:17 Cairo). Everything below updates by itself:
  #   · new YouTube uploads → their cards and pages (scripts/sync-youtube.mjs)
  #   · YouTube subscribers, views, upload count and playlists, and the
  #     TryHackMe numbers (scripts/sync-stats.mjs → data/live-stats.ts)
  #   · the CV: a new PDF in public/Assets/cv/ is read and the /cv page, the
  #     home Experience, the phone / e-mail follow it (scripts/sync-cv.mjs)
  #   · the share cards that show those numbers (npm run og:cases)
  #   · new Credly badges → /certificates (scripts/sync-credly.mjs)
  #   · GitHub stars, new repos and the contribution graph (at build time)
  #   · the "Expires" date of /.well-known/security.txt, the © year, the
  #     footer's "Updated" date and the national-service note (data/status.ts)
  #   · the kanji font, re-cut when a new kanji appears (scripts/kanji-font.mjs)
  # Anything that fails → a GitHub issue (e-mails Ahmed): the "alert" job
  # below; the live site itself is checked weekly (site-health.yml).
  # GitHub pauses scheduled runs after 60 days with no activity — the
  # "keepalive" job below (and the same job in site-health.yml) prevents it.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  # write: the daily sync commits the synced data back (below)
  contents: write
  # an issue when the CV PDF could not be read (below)
  issues: write
  pages: write
  id-token: write

# One deployment at a time; a running deployment is never cancelled
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Lint, type check, data/asset audits, build and link check
  # (.github/workflows/verify.yml). Nothing is deployed unless it passes.
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # base_path is "" in Ahmed-Emad-Nasr.github.io (the domain root) and
      # "/<repo>" in a project repo; base_url is the full live address.
      - id: pages
        uses: actions/configure-pages@v6
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      # Python for the PDF tools (CV metadata and reading the CV)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # New uploads from the YouTube channel → data/youtube-feed.ts. Offline or
      # YouTube down: a warning, and the build goes on with the saved list.
      - run: npm run videos:sync
      # YouTube subscribers / views / uploads / playlists and the TryHackMe
      # numbers → data/live-stats.ts. YOUTUBE_API_KEY (optional repository
      # secret, a free YouTube Data API v3 key) gives the official numbers;
      # without it they are read from the channel's public pages. Whatever
      # can't be read keeps its last value — this step never fails the deploy.
      - run: npm run stats:sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      # The CV PDF → data/cv-from-pdf.ts (only when the PDF changed). A section
      # it can't read keeps its last good version, and .cv-sync-report.md says why.
      - run: npm run cv:sync
      # New Credly badges (credly.com/users/ahmed-emad-nasr) → data/credly-badges.ts
      # and their pictures. Credly down: a warning, nothing changes.
      - run: npm run credly:sync
      # Tell Ahmed (a GitHub issue, which e-mails him) when the CV needs a look.
      # One open issue at a time; closing it re-arms it.
      - name: Report a CV that could not be read
        if: hashFiles('.cv-sync-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" != "true" ]; then
            echo "::warning::The CV could not be read with confidence (see .cv-sync-report.md below). Issues are turned off for this repository (Settings → General → Features → Issues), so no issue was opened."
            cat .cv-sync-report.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          title="CV sync needs a look"
          if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" --body-file .cv-sync-report.md || echo "::warning::could not open the issue"
          fi
      # Save it all in the repo, so a video stays after it leaves the feed's
      # latest 15 and the numbers survive a day YouTube can't be read. A
      # commit made here does not start another deploy. If you pushed at the
      # same moment, the push is skipped and retried next run.
      - name: Commit synced data
        run: |
          files="data/youtube-feed.ts data/live-stats.ts data/cv-from-pdf.ts data/credly-badges.ts public/Assets/cv/AhmedEmadNasr_CV.pdf public/Assets/certificates"
          if [ -n "$(git status --porcelain -- $files)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A -- $files
            if ! git diff --cached --quiet -- data/cv-from-pdf.ts; then
              msg="cv: follow the new CV PDF"
            elif ! git diff --cached --quiet -- data/credly-badges.ts; then
              msg="certificates: add new Credly badges"
            elif ! git diff --cached --quiet -- data/youtube-feed.ts; then
              msg="videos: add new uploads from YouTube"
            else
              msg="stats: refresh YouTube and TryHackMe numbers"
            fi
            git commit -m "$msg"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::could not push the synced data (a newer commit landed) — the next run will"
          fi
      # The small cover of every case image (X-thumb.webp next to X.webp):
      # made here on every deploy, so a missing one never makes a page load
      # the full-size image. Only the missing ones are made (scripts/generate-thumbs.mjs).
      - run: npm run thumbs
      # Writes each certificate's and photo's details INTO the image file
      # (title, description, keywords, copyright, date, place — XMP/IPTC/EXIF)
      # from data/certificates.ts and data/gallery-photos.ts, so a new or
      # edited entry is tagged without anyone running it by hand. Never blocks.
      - name: Image metadata (certificates and gallery photos)
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq libimage-exiftool-perl >/dev/null
          npm run images:tag
      # Warns (never fails) about any image over 300 KB — see scripts/check-image-size.mjs
      - run: npm run check:images
      # The share cards carry live numbers (videos, subscribers, cases …):
      # redraw the ones whose numbers changed (only those — the manifest
      # skips the rest). They are deployed, not committed. Chromium comes
      # from the cache after the first run. Never blocks the deploy.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Share cards with today's numbers
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          npm run og:cases
      # output: "export" in next.config.mjs makes next build write out/
      - run: npm run build
        env:
          # The GitHub API at build time (stars, new repos, contributions) with
          # the workflow's own token: never rate-limited
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      # The kanji font holds only the characters the pages draw. A new kanji
      # in a section → re-cut it, build once more with it, and commit the new
      # font files. Nothing new (almost always): nothing happens. Never blocks.
      - name: Kanji font follows the site's kanji
        id: kanji
        continue-on-error: true
        run: |
          npm run fonts:kanji | tee kanji.log
          if grep -q "kanji-font: changed" kanji.log; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build again with the new kanji font
        if: steps.kanji.outputs.changed == 'true'
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Commit the new kanji font
        if: steps.kanji.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app/fonts app/fonts-yuji-site.css
          git commit -m "fonts: re-cut the kanji font for new characters" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::could not push the kanji font — the next run will"
      # IndexNow's key file (it proves the site is ours — scripts/indexnow.mjs)
      - run: node scripts/indexnow.mjs --key-file
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          # Since v4 dot-folders are left out by default — that would drop
          # /.well-known/security.txt from the site. Keep them.
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

  # GitHub stops the scheduled runs of a repository with no activity for 60
  # days. Re-enabling each scheduled workflow through the API (even one that
  # is still enabled) resets that
  # count (no dummy commits), so the daily deploy, the weekly checks and this
  # job keep each other alive for as long as the repo exists.
  keepalive:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in $(grep -l "schedule:" .github/workflows/*.yml); do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$(basename "$f")/enable" && echo "kept alive: $f"
          done

  # Tell Bing & co. which pages changed (IndexNow, scripts/indexnow.mjs): a new
  # video, case or badge is found in hours. Never blocks anything.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node scripts/indexnow.mjs
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}

  # Something above failed (a check, the build or the deploy): open one GitHub
  # issue — GitHub e-mails it to Ahmed — with the link to the failed run. The
  # live site keeps its last good version meanwhile. One open issue at a time;
  # the next successful run closes it (the "close" step below).
  alert:
    needs: [verify, build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # With Issues turned off, GitHub's own "Run failed" e-mail is the alert
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" != "true" ]; then
            echo "::warning::Issues are turned off for this repository (Settings → General → Features → Issues) — GitHub's \"Run failed\" e-mail is the alert."
            exit 0
          fi
          title="The daily deploy failed"
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -z "$open" ]; then
            gh issue create --title "$title" --body "The run $run failed, so today's version was not published. The live site keeps serving the last good one. Open the run to see which step failed (a check, the build or the deploy). This issue closes by itself after the next successful deploy."
          else
            gh issue comment "$open" --body "Failed again: $run"
          fi

  # A successful deploy closes the "deploy failed" issue, if one is open
  close-alert:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Issues turned off: there is no issue to close
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_issues)" != "true" ]; then exit 0; fi
          open=$(gh issue list --state open --search "in:title \"The daily deploy failed\"" --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue close "$open" --comment "Fixed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} deployed fine."; fi
