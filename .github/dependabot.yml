# Dependabot: weekly pull requests for outdated or vulnerable packages.
# Security updates are opened as soon as an advisory is published; the
# Verify workflow runs on each pull request before anything is merged.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # ESLint stays on 9 until eslint-plugin-react (inside eslint-config-next)
      # supports ESLint 10 — its peer range ends at ^9.7 today.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      # One pull request for the routine minor / patch bumps instead of ten
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
