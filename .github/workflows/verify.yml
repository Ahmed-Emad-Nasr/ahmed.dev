# The site's checks. Every check runs even if an earlier one failed, so one run
# reports every problem. Also called by the deploy workflow as its gate.
name: Verify

on:
  # Pull requests (and Dependabot's) are checked here. Pushes to master run
  # these same checks through the deploy workflow (nextjs.yml calls this file
  # and deploys only if it passes), so they are not repeated here.
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: install
        run: npm ci

      - name: Lint
        if: always() && steps.install.outcome == 'success'
        run: npm run lint
      - name: Type check
        if: always() && steps.install.outcome == 'success'
        run: npm run type-check
      - name: Data references (case ids, ATT&CK, counts)
        if: always() && steps.install.outcome == 'success'
        run: npm run check:data
      - name: Assets referenced in data exist in public/
        if: always() && steps.install.outcome == 'success'
        run: npm run check:assets
      - id: build
        name: Build
        if: always() && steps.install.outcome == 'success'
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Internal links
        if: always() && steps.build.outcome == 'success'
        run: npm run check:links
      # Accessibility in a real browser (scripts/a11y-audit.mjs: axe-core,
      # WCAG 2.2 AA, phone + desktop, dark + light). Pull requests only —
      # Dependabot's included, so an update that breaks accessibility is not
      # merged by itself. It takes a few minutes, so the daily deploy skips it
      # (the weekly Lighthouse check in site-health.yml watches the live site).
      - if: always() && steps.build.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Accessibility (axe)
        if: always() && steps.build.outcome == 'success' && github.event_name == 'pull_request'
        run: |
          npx playwright install --with-deps chromium
          npm run check:a11y
