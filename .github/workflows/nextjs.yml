# Build the static export and deploy it to GitHub Pages
name: Deploy to Pages

on:
  push:
    branches: ["master"]
  # Daily rebuild (05:17 Cairo): adds new YouTube uploads (scripts/sync-youtube.mjs),
  # refreshes the TryHackMe stats, the GitHub stars and contribution graph,
  # and keeps the "Expires" date of /.well-known/security.txt ahead.
  # GitHub pauses scheduled runs after 60 days with no commit — the sync's
  # own commits (below) keep it alive while videos keep coming.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  # write: the YouTube sync commits data/youtube-feed.ts back (below)
  contents: write
  pages: write
  id-token: write

# One deployment at a time; a running deployment is never cancelled
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Lint, type check, data/asset audits, build and link check
  # (.github/workflows/verify.yml). Nothing is deployed unless it passes.
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # base_path is "" in Ahmed-Emad-Nasr.github.io (the domain root) and
      # "/<repo>" in a project repo; base_url is the full live address.
      - id: pages
        uses: actions/configure-pages@v6
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      # New uploads from the YouTube channel → data/youtube-feed.ts. Offline or
      # YouTube down: a warning, and the build goes on with the saved list.
      - run: npm run videos:sync
      # Save the list in the repo, so a video stays after it leaves the feed's
      # latest 15. A commit made here does not start another deploy. If you
      # pushed at the same moment, the push is skipped and retried next run.
      - name: Commit new videos
        run: |
          if ! git diff --quiet -- data/youtube-feed.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/youtube-feed.ts
            git commit -m "videos: add new uploads from YouTube"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::could not push data/youtube-feed.ts (a newer commit landed) — the next run will"
          fi
      # The small cover of every case image (X-thumb.webp next to X.webp):
      # made here on every deploy, so a missing one never makes a page load
      # the full-size image. Only the missing ones are made (scripts/generate-thumbs.mjs).
      - run: npm run thumbs
      # Warns (never fails) about any image over 300 KB — see scripts/check-image-size.mjs
      - run: npm run check:images
      # output: "export" in next.config.mjs makes next build write out/
      - run: npm run build
        env:
          # The GitHub API at build time (stars, new repos, contributions) with
          # the workflow's own token: never rate-limited
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          # Since v4 dot-folders are left out by default — that would drop
          # /.well-known/security.txt from the site. Keep them.
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
