# Dependabot: weekly pull requests for outdated or vulnerable packages.
# Security updates are opened as soon as an advisory is published. Each pull
# request is checked and — when it is a minor/patch update that passes —
# merged and deployed by itself (.github/workflows/dependabot-auto-merge.yml);
# major versions wait for you.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # ESLint stays on 9 until eslint-plugin-react (inside eslint-config-next)
      # supports ESLint 10 — its peer range ends at ^9.7 today.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native rewrite) fails the build today: Next.js and
      # typescript-eslint still expect TypeScript 5/6. Revisit when they
      # list 7 as supported.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # One pull request for the routine minor / patch bumps instead of ten
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # All Action bumps in one pull request
      actions:
        patterns: ["*"]
