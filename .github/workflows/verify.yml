# The site's checks. Every check runs even if an earlier one failed, so one run
# reports every problem. Also called by the deploy workflow as its gate.
name: Verify

on:
  # Pull requests (and Dependabot's) are checked here. Pushes to master run
  # these same checks through the deploy workflow (nextjs.yml calls this file
  # and deploys only if it passes), so they are not repeated here.
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: install
        run: npm ci

      - name: Lint
        if: always() && steps.install.outcome == 'success'
        run: npm run lint
      - name: Type check
        if: always() && steps.install.outcome == 'success'
        run: npm run type-check
      - name: Data references (case ids, ATT&CK, counts)
        if: always() && steps.install.outcome == 'success'
        run: npm run check:data
      - name: Assets referenced in data exist in public/
        if: always() && steps.install.outcome == 'success'
        run: npm run check:assets
      - id: build
        name: Build
        if: always() && steps.install.outcome == 'success'
        run: npm run build
      - name: Internal links
        if: always() && steps.build.outcome == 'success'
        run: npm run check:links
